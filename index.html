
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Regex Playground</h1>
        <p>Test your regular expressions</p>

        <div class="regex-box">
            <label>Regular Expression</label>
            <div class="regex-input">
                <span>/</span>
                <input type="text" id="regex" placeholder="Enter regex...">
                <span>/</span>
            </div>

            
<div class="flags">
    <label>
        <input type="checkbox" id="global" checked>
        Global (g)
    </label>

    <label>
        <input type="checkbox" id="ignoreCase">
        Ignore Case (i)
    </label>

   
</div>

        </div>

        <div class="test-box">
            <label>Test String</label>
            <textarea id="testText" placeholder="Write something to test..."></textarea>
        </div>

        <div class="result-box">
            <h3>Matches: <span id="count">0</span></h3>
            <div id="result"></div>
        </div>


<div class="match-details">
    <h3>Match Details</h3>
    <div id="matchList"></div>
</div>


<div class="replace-box">
    <h3>Regex Replace</h3>

    <label>Replace with</label>
    <input type="text" id="replaceText" placeholder="Enter replacement...">

    <h3>Replaced Text</h3>
    <div id="replaceResult"></div>
</div>


    </div>

    <script src="script.js"></script>
</body>
</html>
